<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Vetor</h1>
    <p id="teste1">Conteudo do vetor 1: </p>
    <p id="teste2">Conteudo do vetor 2: </p>
    <p id="teste3">segunda posiçao do vetor 1 e:  </p>
    <p id="teste4">terceira posiçao do vetor 2 e: </p>
 
    <script type="text/javascript">
        var cores1 = ['verde' , 'amarelo' , 'azul' , 'branco'];
        var cores2 = new Array('vermelho' , 'preto' , 'cinza' , 'roxo');
        document.getElementById('teste1').innerHTML += cores1;
        document.getElementById('teste2').innerHTML += cores2;
        document.getElementById('teste3').innerHTML += cores1[1];
        document.getElementById('teste4').innerHTML += cores2[2];  
    </script>
</body>
</html>
