<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
</head>
<body>
    <h1>Operadores lógicos</h1>
    <h3> Lógico && (e)</h3>

    <script type="text/javascript">

var resposta = true && true;
document.write(resposta + '<br>');

resposta = false && false;
document.write(resposta + '<br>');

resposta = false && true;
document.write(resposta + '<br>');

resposta = false && (3 == 4);
document.write(resposta + '<br>');

resposta = 'Senac' && 'Javascript';
document.write(resposta + '<br>');

resposta = false && '';
document.write(resposta +'<br>');

    </script>

    <h3>Logico || (ou)</h3>
    <script type="text/javascript">

var resposta = true || true;
document.write(resposta +'<br>');

resposta = false || true;
document.write(resposta + '<br>');

resposta = false || (3 == 4);
document.write(resposta + '<br>');

resposta = 'Senac' ||  'Java Script';
document.write(resposta + '<br>');

resposta = false && '';
document.write(resposta + '<br>');

    </script>
</body>
</html>
